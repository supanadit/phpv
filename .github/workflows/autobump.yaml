name: Autobump PHP

# Watches php/php-src for new stable tags (RC/alpha/beta excluded), opens a
# PR that bumps the registry + CI matrix, compiles the new version on a real
# runner, auto-merges on green, tags a phpv release and lets release.yaml
# ship it. No human needed on the happy path; a red build leaves the PR open
# with a `bump-failed` label for someone to look at.
#
# Note: commits/merges made with GITHUB_TOKEN do not trigger other workflows
# (GitHub's recursion guard), so the post-merge test.yaml run does NOT happen
# for these merges. That is fine: the `compile` job above is the gate, and
# release.yaml still fires on the `release: published` event.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours, UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: autobump
  cancel-in-progress: false

env:
  BUMP_BRANCH: autobump/php-versions
  GO_VERSION: "1.25"

jobs:
  detect:
    name: Detect new PHP tags
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      summary: ${{ steps.bump.outputs.summary }}
      new-minor: ${{ steps.bump.outputs.new-minor }}
      matrix: ${{ steps.bump.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Bump registry from upstream tags
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -apply exits 0 and edits nothing when upstream has nothing new.
          go run ./tools/bump -apply | tee bump.log
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "matrix=$(go run ./tools/bump -matrix)" >> $GITHUB_OUTPUT
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          cat bump.log >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if grep -q "NEW MINOR" bump.log; then
            echo "new-minor=true" >> $GITHUB_OUTPUT
          else
            echo "new-minor=false" >> $GITHUB_OUTPUT
          fi

      - name: Unit-test the edited registry
        if: steps.bump.outputs.changed == 'true'
        run: go test ./internal/repository/memory/ ./pkg/version/ ./tools/bump/

  pr:
    name: Open bump PR
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.pr.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Re-apply bump (deterministic)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./tools/bump -apply

      - name: Compute next phpv version
        id: next
        run: |
          LAST=$(git fetch --tags -q && git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "last=$LAST" >> $GITHUB_OUTPUT
          IFS=. read -r MA MI PA <<< "$LAST"
          if [ "${{ needs.detect.outputs.new-minor }}" = "true" ]; then
            echo "next=$MA.$((MI+1)).0" >> $GITHUB_OUTPUT
          else
            echo "next=$MA.$MI.$((PA+1))" >> $GITHUB_OUTPUT
          fi

      - name: Create or update PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BUMP_BRANCH }}
          delete-branch: true
          title: "feat: bump PHP (${{ steps.next.outputs.next }})"
          body: |
            Automatic bump from php/php-src stable tags.

            ```
            ${{ needs.detect.outputs.summary }}
            ```

            Checksums are sha256 of the php.net tarballs phpv downloads.
            The `compile` job builds every changed version from source
            before this merges. Release: `${{ steps.next.outputs.next }}`.
          labels: |
            autobump
            php-versions
          commit-message: |
            feat: bump PHP versions from upstream

            ${{ needs.detect.outputs.summary }}

            Generated by .github/workflows/autobump.yaml.

  compile:
    name: Compile ${{ matrix.php }}
    needs: [detect, pr]
    # Only when a PR was actually opened; its check status attaches to the PR.
    if: needs.pr.result == 'success' && needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUMP_BRANCH }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool m4 re2c bison \
            pkg-config libssl-dev libxml2-dev libsqlite3-dev \
            libgd-dev libonig-dev libzip-dev libicu-dev \
            libcurl4-openssl-dev libpng-dev libjpeg-dev \
            libwebp-dev libxpm-dev libfreetype6-dev \
            libmariadb-dev gettext

      - name: Build phpv and install PHP ${{ matrix.php }}
        env:
          PHPV_ROOT: ${{ github.workspace }}/phpv-root-${{ matrix.php }}
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig
        run: |
          mkdir -p $PHPV_ROOT/bin
          go build -o $PHPV_ROOT/bin/phpv ./app/main.go
          eval "$($PHPV_ROOT/bin/phpv init bash)"
          phpv install ${{ matrix.php }}

      - name: Verify critical extensions
        env:
          PHPV_ROOT: ${{ github.workspace }}/phpv-root-${{ matrix.php }}
        run: |
          eval "$($PHPV_ROOT/bin/phpv init bash)"
          phpv use ${{ matrix.php }}
          php -v
          MISSING=""
          for ext in dom gd intl mbstring pdo_mysql zip curl json phar openssl simplexml xml tokenizer session fileinfo filter bcmath pdo zlib; do
            php -m | grep -qi -w "$ext" || MISSING="$MISSING $ext"
          done
          if [ -n "$MISSING" ]; then
            echo "missing extensions:$MISSING"
            exit 1
          fi

  release:
    name: Merge, tag, release
    needs: [detect, pr, compile]
    # Only after the new versions actually compiled from source.
    if: needs.compile.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Merge the bump PR (squash)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ needs.pr.outputs.pr-number }}');
            const { owner, repo } = context.repo;
            // Ensure the PR head is up to date with main so the merge cannot fail.
            await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr }).catch(() => {});
            await github.rest.pulls.merge({
              owner, repo, pull_number: pr, merge_method: 'squash',
              commit_title: (await github.rest.pulls.get({ owner, repo, pull_number: pr })).data.title,
            });

      - name: Tag the release
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = Number('${{ needs.pr.outputs.pr-number }}');
            const { data: { title } } = await github.rest.pulls.get({ owner, repo, pull_number: pr });
            const next = title.match(/\d+\.\d+\.\d+/)[0];
            const main = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${next}`, sha: main.object.sha });
            core.setOutput('tag', next);

      - name: Publish GitHub release (triggers release.yaml)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            Automatic PHP version bump.

            ```
            ${{ needs.detect.outputs.summary }}
            ```

  flag-failure:
    name: Flag failed bump
    needs: [detect, pr, compile]
    if: always() && needs.compile.result != 'success' && needs.pr.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number('${{ needs.pr.outputs.pr-number }}'),
              labels: ['bump-failed']
            });
